[project]
name = "fastapi-template"
version = "0.1.0"
description = "Simple, but all needed fastapi app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-instrumentation-structlog>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "ruff>=0.17.0",
]
